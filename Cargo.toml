[package]
name = "rendog-launcher"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "RendogLauncher"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = "1.8"

[build-dependencies]
slint-build = "1.8"
winresource = "0.1.31"

[profile.release]
lto = true
codegen-units = 1
strip = true
